<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Watcher control flow diagram">
  <rect width="900" height="360" fill="#111923"/>
  <text x="450" y="42" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#e7eef7">Watcher Control</text>
  <g font-family="Segoe UI, Arial" fill="#cbd5e3">
    <rect x="60" y="105" width="190" height="76" rx="10" fill="#1b2633" stroke="#b7c7df"/>
    <text x="155" y="137" text-anchor="middle" font-size="17" font-weight="700">Trigger</text>
    <text x="155" y="162" text-anchor="middle" font-size="13">text, image, variable, state</text>
    <rect x="355" y="75" width="190" height="76" rx="10" fill="#1b2633" stroke="#84c79b"/>
    <text x="450" y="107" text-anchor="middle" font-size="17" font-weight="700">Background actions</text>
    <text x="450" y="132" text-anchor="middle" font-size="13">runs alongside</text>
    <rect x="355" y="210" width="190" height="76" rx="10" fill="#1b2633" stroke="#e0bf82"/>
    <text x="450" y="242" text-anchor="middle" font-size="17" font-weight="700">Stop Block</text>
    <text x="450" y="267" text-anchor="middle" font-size="13">stop a chosen block</text>
    <rect x="650" y="210" width="190" height="76" rx="10" fill="#1b2633" stroke="#84c79b"/>
    <text x="745" y="242" text-anchor="middle" font-size="17" font-weight="700">Start Block at Step</text>
    <text x="745" y="267" text-anchor="middle" font-size="13">resume at a chosen Step ID</text>
    <path d="M250 143 C295 143 315 113 355 113" stroke="#8fa2b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M250 143 C300 143 315 248 355 248" stroke="#8fa2b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M545 248 H650" stroke="#8fa2b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fa2b8"/>
    </marker>
  </defs>
</svg>
