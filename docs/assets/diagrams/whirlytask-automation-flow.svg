<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="WhirlyTask flow overview">
  <rect width="1000" height="430" fill="#111923"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#cbd5e3">WhirlyTask Automation Flow</text>
  <g font-family="Segoe UI, Arial" fill="#cbd5e3">
    <rect x="50" y="95" width="180" height="92" rx="10" fill="#1b2633" stroke="#436182" stroke-width="2"/>
    <text x="140" y="130" text-anchor="middle" font-size="17" font-weight="700">Tracks</text>
    <text x="140" y="156" text-anchor="middle" font-size="13">recorded input</text>
    <text x="140" y="176" text-anchor="middle" font-size="13">short repeatable actions</text>

    <rect x="292" y="95" width="190" height="92" rx="10" fill="#1b2633" stroke="#436182" stroke-width="2"/>
    <text x="387" y="130" text-anchor="middle" font-size="17" font-weight="700">Premade Blocks</text>
    <text x="387" y="156" text-anchor="middle" font-size="13">reusable selected steps</text>
    <text x="387" y="176" text-anchor="middle" font-size="13">saved step selections</text>

    <rect x="510" y="82" width="260" height="118" rx="10" fill="#1b2633" stroke="#84c79b" stroke-width="2"/>
    <text x="640" y="120" text-anchor="middle" font-size="17" font-weight="700">Sequences</text>
    <text x="640" y="146" text-anchor="middle" font-size="13">steps, variables, logic</text>
    <text x="640" y="166" text-anchor="middle" font-size="13">read text, click, branch</text>
    <text x="640" y="186" text-anchor="middle" font-size="13">reuse tracks and imported steps</text>

    <rect x="820" y="95" width="160" height="92" rx="10" fill="#1b2633" stroke="#e3b66c" stroke-width="2"/>
    <text x="900" y="130" text-anchor="middle" font-size="17" font-weight="700">Watchers</text>
    <text x="900" y="156" text-anchor="middle" font-size="13">background checks</text>
    <text x="900" y="176" text-anchor="middle" font-size="13">recover or alert</text>

    <path d="M140 187 V224 H640 V200" fill="none" stroke="#8fa2b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M482 141 H510" stroke="#8fa2b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M820 141 H770" stroke="#8fa2b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="90" y="258" width="820" height="64" rx="10" fill="#1b2633" stroke="#c9d3df"/>
    <text x="500" y="286" text-anchor="middle" font-size="16" font-weight="700">Recognition and app features</text>
    <text x="500" y="309" text-anchor="middle" font-size="14">Screen text reading, image matching, protections, Discord alerts, hotkeys, recording, loop, library</text>

    <rect x="190" y="350" width="620" height="50" rx="10" fill="#1b2633" stroke="#c9d3df"/>
    <text x="500" y="381" text-anchor="middle" font-size="15">Connect steps, verify targets, read results, react to events and stop when needed</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fa2b8"/>
    </marker>
  </defs>
</svg>
